# Render Blueprint — https://render.com/docs/blueprint-spec
# This repo is a fully static site: no build step, no server process needed.
services:
  - type: web
    runtime: static
    name: firemc-web
    staticPublishPath: .            # index.html lives at the repo root
    buildCommand: echo "Static site — no build required"
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
